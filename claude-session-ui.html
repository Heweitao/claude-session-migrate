<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Session Migration</title>
<style>
  :root{
    --bg:#f6f5f3; --surface:#fff; --surface-2:#faf9f7;
    --line:#e8e5e1; --line-soft:#f1efec;
    --text:#1f1d1a; --text-2:#57534d; --muted:#8a837a;
    --accent:#c0603c; --accent-hover:#a9512f; --accent-soft:#fdf2ec; --accent-line:#f0d6c8;
    --ok:#1a7f45; --warn:#a85912; --warn-soft:#fef6e7; --danger:#b3261e;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --shadow:0 1px 2px rgba(31,29,26,.06),0 8px 24px -12px rgba(31,29,26,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button,select,input{font:inherit;color:inherit}

  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- top bar ---------- */
  header.top{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;flex:none;
    background:var(--surface);border-bottom:1px solid var(--line);-webkit-app-region:drag}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em}
  .brand .mark{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),#d98a67);color:#fff;font-size:12px;font-weight:700}
  .top .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--text-2);white-space:nowrap}
  .chip b{font-weight:600;color:var(--text);font-family:var(--mono);font-size:11.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(26,127,69,.12)}
  .dot.bad{background:var(--warn);box-shadow:0 0 0 3px rgba(168,89,18,.14)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;
    border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;
    font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--surface-2);border-color:#dcd7d1}
  .btn:disabled{cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.primary:disabled{background:#e6e2dc;border-color:#e6e2dc;color:#a49d95}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
  .btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--line)}
  .btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
  .btn.danger{color:var(--danger);border-color:#e8d5d3}
  .btn.danger:hover:not(:disabled){background:#fdf3f2}

  .body{display:flex;flex:1;min-height:0}

  /* ---------- sidebar ---------- */
  aside.side{width:212px;flex:none;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .side-head{padding:13px 14px 6px;font-size:10.5px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.07em}
  .side-list{flex:1;overflow-y:auto;padding:0 8px 10px}
  .side-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;
    user-select:none;color:var(--text-2);position:relative}
  .side-item:hover{background:var(--surface-2)}
  .side-item.active{background:var(--accent-soft);color:var(--accent-hover);font-weight:500}
  .side-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:11.5px}
  .side-item .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .side-item.active .ct{color:var(--accent-hover)}
  .side-item .tag{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
  .side-sub{padding:9px 8px 2px;font-size:10px;font-weight:600;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .side-foot{padding:9px 14px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--muted);line-height:1.55}
  .side-foot code{font-family:var(--mono);font-size:10px;word-break:break-all}

  /* ---------- main ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}

  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;
    border-bottom:1px solid var(--line);flex:none;background:var(--surface)}
  .search{position:relative;flex:1 1 150px;max-width:240px}
  .search input{width:100%;height:30px;padding:0 10px 0 29px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);outline:none}
  .search input:focus{border-color:var(--accent-line);background:#fff;box-shadow:0 0 0 3px rgba(192,96,60,.07)}
  .search svg{position:absolute;left:9px;top:8.5px;color:var(--muted)}
  select{height:30px;padding:0 25px 0 9px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3.5L5 6.5L8 3.5' stroke='%238a837a' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>") no-repeat right 8px center;
    -webkit-appearance:none;appearance:none;cursor:pointer;font-size:12.5px;outline:none;max-width:190px;text-overflow:ellipsis}
  select:focus{border-color:var(--accent-line);background-color:#fff}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);cursor:pointer;
    user-select:none;white-space:nowrap}
  .chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;margin:0}
  .vdiv{width:1px;height:20px;background:var(--line);flex:none;margin:0 3px}
  .grow{flex:1}
  .tgt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}

  .tablewrap{flex:1;overflow:auto;position:relative}
  table{width:100%;border-collapse:separate;border-spacing:0}
  thead th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;
    font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
    padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{cursor:pointer;outline:none}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.sel{background:var(--accent-soft)}
  tbody tr.sel:hover{background:#fbe9e0}
  tbody tr:focus-visible{box-shadow:inset 2px 0 0 var(--accent)}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .c-title{max-width:0;width:46%}
  .title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;margin-top:1px}
  .acct-cell{width:112px}
  .adot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
    vertical-align:middle;flex:none}
  .acct-cell .id{font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
  .acct-cell .sp{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px}
  .time{width:108px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .model{width:100px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .flags{width:118px;text-align:right;padding-right:8px!important}
  .act{width:56px;text-align:right;padding-right:14px!important}
  td.c,th.c{text-align:center;width:38px;padding-left:8px!important}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;margin:0}

  .pill{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;
    font-size:10.5px;font-weight:500;border:1px solid transparent;white-space:nowrap;margin-left:4px}
  .pill.cur{background:var(--accent-soft);color:var(--accent-hover);border-color:var(--accent-line)}
  .pill.arch{background:#f3f1ee;color:var(--text-2);border-color:var(--line)}
  .pill.no{background:var(--warn-soft);color:var(--warn);border-color:#f5e3c4}
  .pill.dup{background:#f1f5fb;color:#2f4a6d;border-color:#dbe4f0}

  .rowbtn{opacity:0;transition:opacity .1s}
  tbody tr:hover .rowbtn{opacity:1}

  /* project grouping */
  tbody tr.grp{cursor:pointer;background:var(--surface-2)}
  tbody tr.grp:hover{background:#f4f2ef}
  tbody tr.grp td{padding:0!important;border-bottom:1px solid var(--line)}
  .grphd{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:32px}
  .chev{width:12px;flex:none;color:var(--text-2);font-size:9px;line-height:1;transition:transform .14s}
  .chev.open{transform:rotate(90deg)}
  .gname{font-weight:600;font-size:12.5px;white-space:nowrap}
  .gpath{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;max-width:46%}
  .gcount{font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);
    border-radius:9px;padding:1px 7px;flex:none}
  .gright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);
    white-space:nowrap;flex:none}
  tbody tr.g-row td.c-title{padding-left:27px}
  .side-div{height:1px;background:var(--line-soft);margin:8px 6px 0}

  .empty{padding:72px 24px;text-align:center;color:var(--muted)}
  .empty h3{margin:0 0 6px;font-size:14px;color:var(--text-2);font-weight:600}
  .empty p{margin:0;font-size:12.5px}
  .empty button{margin-top:14px}

  .statusbar{flex:none;display:flex;align-items:center;gap:14px;height:31px;padding:0 14px;
    border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--muted)}
  .statusbar .spacer{flex:1}

  /* ---------- preview drawer ---------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--surface);
    border-left:1px solid var(--line);box-shadow:-16px 0 40px -28px rgba(31,29,26,.4);
    transform:translateX(101%);transition:transform .22s cubic-bezier(.32,.72,0,1);
    z-index:40;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dh{padding:13px 16px 11px;border-bottom:1px solid var(--line);flex:none}
  .dh .t{font-size:14px;font-weight:600;line-height:1.35;padding-right:24px}
  .dh .close{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:6px;border:0;
    background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;font-size:15px}
  .dh .close:hover{background:var(--surface-2);color:var(--text)}
  .dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:10.5px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);font-family:var(--mono)}
  .dbody{flex:1;overflow-y:auto;padding:6px 16px 16px}
  .dempty{color:var(--muted);font-size:12.5px;padding:20px 0;text-align:center}
  .firstq{margin:12px 0 4px;padding:9px 11px;border-radius:8px;background:var(--accent-soft);
    border:1px solid var(--accent-line);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .firstq .lbl{display:block;font-size:10px;font-weight:600;color:var(--accent-hover);
    letter-spacing:.05em;margin-bottom:3px;text-transform:uppercase}
  .msg{padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .msg:last-child{border-bottom:0}
  .msg .who{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:3px}
  .msg.me .who{color:var(--accent)}
  .msg .txt{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.62;color:var(--text-2)}
  .msg.me .txt{color:var(--text)}
  .msg.more .txt{cursor:pointer;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;
    overflow:hidden;position:relative}
  .msg.more.open .txt{display:block;overflow:visible}
  .msg.more:not(.open) .who::after{content:" · click to expand";font-weight:400;letter-spacing:0;
    text-transform:none;color:var(--muted)}
  .dfoot{flex:none;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);
    display:flex;gap:8px;align-items:center}
  .dfoot .hint{flex:1;font-size:11px;color:var(--muted)}
  .skel{height:11px;border-radius:4px;background:linear-gradient(90deg,#f2f0ed,#faf8f6,#f2f0ed);
    background-size:200% 100%;animation:sh 1.1s infinite;margin:7px 0}
  @keyframes sh{to{background-position:-200% 0}}

  /* ---------- profiles ---------- */
  .modal.wide{max-width:660px}
  .pcard{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:8px;background:var(--surface)}
  .pmain{flex:1;min-width:0}
  .pname{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
  .ppath{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pstat{font-size:11.5px;color:var(--text-2);margin-top:4px;display:flex;align-items:center;
    gap:6px;flex-wrap:wrap}
  .pstat .sep{color:#dcd7d1}
  .pact{display:flex;gap:6px;flex:none}
  .newprof{display:flex;gap:7px;align-items:center;flex:1;margin-right:10px}
  .newprof input{flex:1;height:29px;padding:0 9px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);outline:none;font-size:12.5px;min-width:0}
  .newprof input:focus{border-color:var(--accent-line);background:#fff}
  .usage{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:nowrap;
    font-size:11px;color:var(--text-2);overflow:hidden}
  .ulabel{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
  .ubar{display:inline-block;width:62px;height:5px;border-radius:3px;background:#efece8;
    overflow:hidden;vertical-align:middle}
  .ubar i{display:block;height:100%;border-radius:3px}
  .uspark{display:inline-block;vertical-align:middle;margin-left:2px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(31,29,26,.3);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .overlay.on{display:flex}
  .modal{width:100%;max-width:560px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;max-height:82vh}
  .modal h2{margin:0;padding:15px 20px 11px;font-size:15px;font-weight:600}
  .modal .mbody{padding:0 20px 16px;overflow:auto}
  .modal .mfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:11px 20px;
    border-top:1px solid var(--line);background:var(--surface-2)}
  .modal .mfoot .left{margin-right:auto;font-size:11.5px;color:var(--muted)}
  .kv{display:flex;gap:10px;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line-soft)}
  .kv:last-child{border-bottom:0}
  .kv .k{width:54px;color:var(--muted);flex:none}
  .kv .v{flex:1;min-width:0;word-break:break-all}
  .kv code,.mono{font-family:var(--mono);font-size:11.5px}
  .plist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
  .plist div{padding:5px 10px;font-size:12.5px;border-bottom:1px solid var(--line-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plist div:last-child{border-bottom:0}
  .notice{display:flex;gap:9px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;
    background:var(--warn-soft);color:#7c420f;border:1px solid #f2e0bf;margin-bottom:12px}
  .notice.info{background:#f1f5fb;color:#2f4a6d;border-color:#dbe4f0}
  .notice b{font-weight:600}

  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{min-width:250px;max-width:400px;padding:10px 13px;border-radius:9px;background:#26241f;color:#fff;
    font-size:12.5px;box-shadow:var(--shadow);animation:in .16s ease-out;display:flex;align-items:center;gap:12px}
  .toast.err{background:#8f221b}
  .toast.ok{background:#1a6b3c}
  .toast .undo{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;padding:3px 9px;
    border-radius:5px;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .toast .undo:hover{background:rgba(255,255,255,.28)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark">C</span>Claude Session Migration</div>
    <div class="spacer"></div>
    <div class="chip" id="curAcct">Loading…</div>
    <div class="chip"><span class="dot" id="runDot"></span><span id="runText">Checking</span></div>
    <button class="btn ghost sm" id="profilesBtn">Profiles</button>
    <button class="btn ghost sm" id="reloadBtn">Refresh</button>
  </header>

  <div class="body">
    <aside class="side">
      <div class="side-head">Accounts</div>
      <div class="side-list" id="sideList"></div>
      <div class="side-foot">Data folder<br><code id="dirText"></code></div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="q" placeholder="Search title or path…" autocomplete="off">
        </div>
        <select id="sortSel" title="Sort">
          <option value="time">Last activity ↓</option>
          <option value="timeAsc">Oldest first ↑</option>
          <option value="title">Title A-Z</option>
        </select>
        <label class="chk"><input type="checkbox" id="hideCur">Hide current</label>
        <label class="chk"><input type="checkbox" id="groupBox">Group by project</label>
        <div class="vdiv"></div>
        <div class="tgt">
          <span>Migrate to</span>
          <select id="toProfile" title="Target profile"></select>
          <select id="toAccount"></select>
          <select id="toSpace"></select>
        </div>
        <div class="grow"></div>
        <span class="chip" id="selCount" style="height:24px">None selected</span>
        <button class="btn" id="syncBtn" title="Copy the sessions currently listed into the target">Sync</button>
        <button class="btn primary" id="goBtn" disabled>Migrate</button>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th class="c"><input type="checkbox" id="allBox" title="Select all filtered"></th>
              <th>Session</th>
              <th>From account</th>
              <th>Last activity</th>
              <th style="text-align:right;padding-right:8px">Flags</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none"></div>
      </div>

      <div class="statusbar">
        <span id="statTotal"></span>
        <span id="statTarget"></span>
        <div class="spacer"></div>
        <span id="hint">⌘A select all · Space toggle · ↵ preview · / search</span>
      </div>
    </main>
  </div>
</div>

<aside class="drawer" id="drawer">
  <div class="dh" style="position:relative">
    <div class="t" id="dTitle">…</div>
    <div class="dmeta" id="dMeta"></div>
    <button class="close" id="dClose" title="Close (Esc)">✕</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <span class="hint" id="dHint"></span>
    <button class="btn" id="dMigrate">Migrate this session</button>
  </div>
</aside>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("csm:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("csm:" + k, JSON.stringify(v)); } catch {} },
};

const S = {
  snap: null, filter: null, q: "", hideCur: LS.get("hideCur", true),
  project: LS.get("project", ""), sort: LS.get("sort", "time"),
  group: LS.get("group", true), collapsed: new Set(LS.get("collapsed", [])),
  dedupe: LS.get("dedupe", true), merged: 0,
  sel: new Set(), lastIdx: -1,
  target: { profile: LS.get("toProfile", null), account: null, space: null },
  busy: false, drawer: null, hover: -1,
};

// a session is identified by profile + id: the same id can exist in several profiles
const skey = s => `${s.profile}|${s.id}`;
const byKey = k => S.snap.sessions.find(s => skey(s) === k);
const profiles = () => (S.snap ? S.snap.profiles : []);
const profileOf = n => profiles().find(p => p.name === n);
const multiProfile = () => profiles().length > 1;

// stable hue per account so rows are scannable without reading UUIDs
const acctHue = id => {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
};
const acctDot = id => `<span class="adot" style="background:hsl(${acctHue(id)},42%,62%)"></span>`;

const folderName = cwd => {
  if (!cwd || cwd === "-") return "Unknown folder";
  const parts = String(cwd).split("/").filter(Boolean);
  return parts[parts.length - 1] || cwd;
};

/* ================= data ================= */
async function load(silent) {
  try {
    const j = await (await fetch("/api/state")).json();
    if (!j.ok) throw new Error(j.error);
    S.snap = j.data;
    if (!S.target.profile || !profileOf(S.target.profile)) S.target.profile = S.snap.currentProfile;
    const tp = profileOf(S.target.profile);
    if (!tp || !S.target.account || !tp.accounts.some(a => a.id === S.target.account))
      S.target.account = tp ? (tp.current.account || (tp.accounts[0] || {}).id) : null;
    if (!S.target.space) S.target.space = tp ? tp.current.space : null;
    const keys = new Set(S.snap.sessions.map(skey));
    [...S.sel].forEach(k => { if (!keys.has(k)) S.sel.delete(k); });
    render();
    if (silent && S.drawer) refreshDrawer();
  } catch (e) {
    toast("Failed to load: " + e.message, "err");
  }
}

const dupIndex = () => {
  const m = new Map();
  for (const s of S.snap.sessions) {
    if (!s.cliSessionId) continue;
    if (!m.has(s.cliSessionId)) m.set(s.cliSessionId, []);
    m.get(s.cliSessionId).push(s);
  }
  return m;
};

// sits exactly where we would migrate it to — not the same thing as "current profile"
const inTarget = r => r.profile === S.target.profile && r.account === S.target.account
  && r.space === S.target.space;

// is this session already present in the target account (same id, or same cliSessionId)?
const existsInTarget = s => S.snap.sessions.some(x =>
  x.profile === S.target.profile && x.account === S.target.account && x.space === S.target.space &&
  (x.id === s.id || (!!s.cliSessionId && x.cliSessionId === s.cliSessionId)));

const projects = () => {
  const m = new Map();
  for (const s of S.snap.sessions) m.set(s.cwd, (m.get(s.cwd) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
};

function visible(opts) {
  if (!S.snap) return [];
  const q = S.q.trim().toLowerCase();
  const t0 = r => r.activity || 0;
  const hideCur = S.hideCur && !(opts && opts.ignoreHideCur);
  let rows = S.snap.sessions.filter(s => {
    if (S.filter && (s.profile !== S.filter.profile || s.account !== S.filter.account)) return false;
    if (S.project && s.cwd !== S.project) return false;
    if (hideCur && s.current) return false;
    if (q && !(s.title.toLowerCase().includes(q) || s.cwd.toLowerCase().includes(q)
             || (s.model || "").toLowerCase().includes(q) || s.id.includes(q))) return false;
    return true;
  });
  // one session can be copied into several accounts — show it once
  if (S.dedupe && !(opts && opts.noDedupe)) {
    const score = x => (inTarget(x) ? 4 : 0) + (x.current ? 2 : 0);
    const best = new Map();
    for (const r of rows) {
      const k = r.cliSessionId || r.id;
      const cur = best.get(k);
      if (!cur || score(r) > score(cur) || (score(r) === score(cur) && t0(r) > t0(cur))) best.set(k, r);
    }
    S.merged = rows.length - best.size;
    rows = [...best.values()];
  } else {
    S.merged = 0;
  }

  const t = r => r.activity || 0;
  const cmp = S.sort === "timeAsc" ? (a, b) => t(a) - t(b)
            : S.sort === "title"   ? (a, b) => a.title.localeCompare(b.title, "zh")
            : (a, b) => t(b) - t(a);

  if (!S.group) return rows.sort(cmp);

  // grouped: sort within group, order groups by latest activity
  const g = new Map();
  for (const r of rows) {
    const k = r.cwd || "-";
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(r);
  }
  for (const arr of g.values()) arr.sort(cmp);
  const latest = k => g.get(k).reduce((m, r) => Math.max(m, t(r)), 0);
  return [...g.keys()].sort((a, b) => latest(b) - latest(a)).flatMap(k => g.get(k));
}

/* ================= rendering ================= */
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms), now = new Date(), p = n => String(n).padStart(2, "0");
  const diff = (now - d) / 86400000;
  if (diff < 1) return "Today " + p(d.getHours()) + ":" + p(d.getMinutes());
  if (diff < 2) return "Yesterday " + p(d.getHours()) + ":" + p(d.getMinutes());
  return (d.getFullYear() === now.getFullYear() ? "" : d.getFullYear() + "-")
       + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function render() {
  const s = S.snap;
  if (!s) return;
  const curP = profileOf(s.currentProfile) || s.profiles[0] || { name: "-", current: {} };
  $("#curAcct").innerHTML = (multiProfile() ? `${esc(curP.name)} · account ` : "Current account ")
    + `<b>${esc((curP.current.account || "—").slice(0, 8))}</b>`;
  const runningNow = s.profiles.filter(p => p.running);
  const run = runningNow.length > 0;
  $("#runDot").className = "dot" + (run ? " bad" : "");
  $("#runText").textContent = run
    ? (runningNow.length > 1 ? `Claude running ×${runningNow.length}`
       : `Claude running (${runningNow[0].name})`)
    : "Claude not running";
  $("#hideCur").checked = S.hideCur;
  $("#groupBox").checked = S.group;
  const folderHint = multiProfile() ? s.profilesRoot : ((s.profiles[0] || {}).path || s.profilesRoot);
  $("#dirText").textContent = folderHint.replace(/^\/Users\/[^/]+/, "~");

  // sidebar
  const fkey = S.filter ? `${S.filter.profile}|${S.filter.account}` : null;
  let html = `<div class="side-item ${!S.filter ? "active" : ""}" data-a="">
    <span class="nm" style="font-family:inherit">All sessions</span><span class="ct">${s.sessions.length}</span></div>`;
  for (const p of s.profiles) {
    if (multiProfile()) html += `<div class="side-sub">${esc(p.name)}</div>`;
    for (const a of p.accounts) {
      if (a.count === 0 && !a.isCurrent) continue;
      const k = `${p.name}|${a.id}`;
      html += `<div class="side-item ${fkey === k ? "active" : ""}" data-p="${esc(p.name)}" data-a="${esc(a.id)}">
        ${a.isCurrent ? '<span class="tag"></span>' : ""}
        <span class="nm">${acctDot(a.id)}${esc(a.short)}${a.isCurrent ? " current" : ""}</span>
        <span class="ct">${a.count}</span></div>`;
    }
  }
  $("#sideList").innerHTML = html + (() => {
    const ps = projects();
    let h = `<div class="side-div"></div><div class="side-head" style="padding:9px 6px 4px">Projects</div>`;
    h += `<div class="side-item ${!S.project ? "active" : ""}" data-proj="__all__">
      <span class="nm" style="font-family:inherit">All projects</span>
      <span class="ct">${s.sessions.length}</span></div>`;
    for (const [c, n] of ps) {
      h += `<div class="side-item ${S.project === c ? "active" : ""}" data-proj="${esc(c)}" title="${esc(c)}">
        <span class="nm" style="font-family:inherit">${esc(folderName(c))}</span>
        <span class="ct">${n}</span></div>`;
    }
    return h;
  })();
  document.querySelectorAll(".side-item").forEach(el => {
    el.onclick = () => {
      if ("proj" in el.dataset) {
        S.project = el.dataset.proj === "__all__" ? "" : el.dataset.proj;
        LS.set("project", S.project);
      } else {
        S.filter = el.dataset.a ? { profile: el.dataset.p, account: el.dataset.a } : null;
      }
      render();
    };
  });

  // project filter lives in the sidebar
  if (S.project && !projects().some(x => x[0] === S.project)) {
    S.project = "";
    LS.set("project", "");
  }
  $("#sortSel").value = S.sort;

  // target profile / account / space
  const pfSel = $("#toProfile");
  const psig = s.profiles.map(p => p.name).join();
  if (pfSel.dataset.sig !== psig) {
    pfSel.innerHTML = s.profiles.map(p =>
      `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
    pfSel.dataset.sig = psig;
  }
  pfSel.value = S.target.profile || "";
  pfSel.style.display = multiProfile() ? "" : "none";

  const tgtP = profileOf(S.target.profile);
  // switching profile invalidates the account choice — fall back to that profile's current one
  if (!tgtP || !S.target.account || !tgtP.accounts.some(a => a.id === S.target.account)) {
    S.target.account = tgtP ? (tgtP.current.account || (tgtP.accounts[0] || {}).id) : null;
    S.target.space = null;
  }
  const accSel = $("#toAccount");
  const asig = (tgtP ? tgtP.accounts.map(a => a.id).join() : "");
  if (accSel.dataset.sig !== asig) {
    accSel.innerHTML = (tgtP ? tgtP.accounts : []).map(a =>
      `<option value="${esc(a.id)}">${esc(a.short)}${a.isCurrent ? " (current)" : ""}</option>`).join("");
    accSel.dataset.sig = asig;
  }
  accSel.value = S.target.account || "";
  const acct = tgtP ? tgtP.accounts.find(a => a.id === S.target.account) : null;
  const spaces = acct ? acct.spaces : [];
  const spSel = $("#toSpace");
  const ssig = S.target.account + "|" + spaces.map(x => x.id).join();
  if (spSel.dataset.sig !== ssig) {
    spSel.innerHTML = spaces.map(x => `<option value="${esc(x.id)}">Space ${esc(x.short)}</option>`).join("");
    spSel.dataset.sig = ssig;
  }
  if (!spaces.some(x => x.id === S.target.space)) {
    const cur = spaces.find(x => x.isCurrent) || spaces[0];
    S.target.space = cur ? cur.id : null;
  }
  spSel.value = S.target.space || "";
  spSel.style.display = spaces.length > 1 ? "" : "none";

  // table
  const rows = visible(), tbody = $("#rows");
  const tgtA = tgtP ? tgtP.accounts.find(a => a.id === S.target.account) : null;
  if (!rows.length) {
    tbody.innerHTML = "";
    const e = $("#empty");
    e.style.display = "block";
    e.innerHTML = `<h3>No matching sessions</h3>
      <p>${S.hideCur ? "Sessions in the current account are hidden." : "Try another keyword or pick another account."}</p>
      ${S.hideCur ? '<button class="btn sm" id="unhide">Show current-account sessions</button>' : ""}`;
    const ub = $("#unhide");
    if (ub) ub.onclick = () => { S.hideCur = false; LS.set("hideCur", false); $("#hideCur").checked = false; render(); };
  } else {
    $("#empty").style.display = "none";
    const shown = S.group ? rows.filter(r => !S.collapsed.has(r.cwd || "-")) : rows;

    const rowHTML = (r, i) => {
      const flags = [];
      if (r.current) flags.push('<span class="pill cur">Current</span>');
      if (r.archived) flags.push('<span class="pill arch">Archived</span>');
      if (!r.transcript.found) flags.push('<span class="pill no">No transcript</span>');
      else if (existsInTarget(r) && r.id !== (tgtA && tgtA.id))
        flags.push('<span class="pill dup" title="Already present in the target location">Exists</span>');
      const on = S.sel.has(skey(r));
      return `<tr data-key="${esc(skey(r))}" data-i="${i}" class="${on ? "sel" : ""} ${S.group ? "g-row" : ""}" tabindex="0">
        <td class="c"><input type="checkbox" ${on ? "checked" : ""} ${inTarget(r) ? "disabled" : ""}></td>
        <td class="c-title">
          <div class="title" title="${esc(r.title)}${r.model ? " · " + esc(r.model) : ""}">${esc(r.title)}</div>
          <div class="sub" title="${esc(r.cwd)}">${esc(r.cwd)}</div>
        </td>
        <td class="acct-cell" title="profile ${esc(r.profile)} · space ${esc(r.space.slice(0, 8))}">
          <div class="id">${acctDot(r.account)}${esc(r.account.slice(0, 8))}</div></td>
        <td class="time" title="${new Date(r.activity || 0).toLocaleString()}">${fmtTime(r.activity)}</td>
        <td class="flags">${flags.join("")}</td>
        <td class="act">${inTarget(r) ? "" :
          '<button class="btn sm ghost rowbtn" data-mig="1" title="Migrate to the target account">→</button>'}</td>
      </tr>`;
    };

    let html = "";
    if (S.group) {
      const groups = new Map();
      for (const r of rows) {
        const k = r.cwd || "-";
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(r);
      }
      for (const [cwd, arr] of groups) {
        const open = !S.collapsed.has(cwd);
        const pick = arr.filter(r => !inTarget(r));
        const allSel = pick.length > 0 && pick.every(r => S.sel.has(skey(r)));
        const selN = pick.filter(r => S.sel.has(skey(r))).length;
        const latest = arr.reduce((m, r) => Math.max(m, r.activity || 0), 0);
        html += `<tr class="grp" data-cwd="${esc(cwd)}"><td colspan="6"><div class="grphd">
          <span class="chev ${open ? "open" : ""}">▶</span>
          <input type="checkbox" class="gchk" ${allSel ? "checked" : ""} ${pick.length ? "" : "disabled"}>
          <span class="gname">${esc(folderName(cwd))}</span>
          <span class="gpath">${esc(cwd)}</span>
          <span class="gcount">${arr.length}</span>
          <div class="gright">${selN ? `<span>${selN} selected</span>` : ""}<span>${fmtTime(latest)}</span></div>
        </div></td></tr>`;
        if (open) for (const r of arr) html += rowHTML(r, shown.indexOf(r));
      }
    } else {
      html = rows.map((r, i) => rowHTML(r, i)).join("");
    }
    tbody.innerHTML = html;

    // group header: collapse / select whole group
    tbody.querySelectorAll("tr.grp").forEach(tr => {
      const cwd = tr.dataset.cwd, box = tr.querySelector(".gchk");
      const pick = rows.filter(x => (x.cwd || "-") === cwd && !inTarget(x));
      const allSel = pick.length > 0 && pick.every(x => S.sel.has(skey(x)));
      box.indeterminate = !allSel && pick.some(x => S.sel.has(skey(x)));
      box.onclick = ev => ev.stopPropagation();
      box.onchange = () => {
        pick.forEach(x => box.checked ? S.sel.add(skey(x)) : S.sel.delete(skey(x)));
        render();
      };
      tr.querySelector(".grphd").onclick = ev => {
        if (ev.target === box) return;
        S.collapsed.has(cwd) ? S.collapsed.delete(cwd) : S.collapsed.add(cwd);
        LS.set("collapsed", [...S.collapsed]);
        render();
      };
    });

    tbody.querySelectorAll("tr[data-key]").forEach(tr => {
      const k = tr.dataset.key;
      const item = byKey(k);
      const i = +tr.dataset.i;
      tr.onclick = ev => {
        if (ev.target.closest("[data-mig]")) { ev.stopPropagation(); singleMigrate(k); return; }
        if (ev.target.tagName === "INPUT") return;
        if (item && inTarget(item)) { openDrawer(k); return; }
        if (ev.shiftKey && S.lastIdx >= 0) {
          const [a, b] = [Math.min(S.lastIdx, i), Math.max(S.lastIdx, i)];
          const on = !S.sel.has(k);
          shown.slice(a, b + 1).filter(x => !inTarget(x)).forEach(x => on ? S.sel.add(skey(x)) : S.sel.delete(skey(x)));
        } else {
          S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k);
        }
        S.lastIdx = i;
        render();
      };
      tr.ondblclick = () => openDrawer(k);
      tr.onkeydown = ev => {
        const all = [...tbody.querySelectorAll("tr[data-key]")];
        const pos = all.indexOf(tr);
        if (ev.key === " ") { ev.preventDefault(); tr.click(); }
        if (ev.key === "Enter") { ev.preventDefault(); openDrawer(k); }
        if (ev.key === "ArrowDown" && all[pos + 1]) { ev.preventDefault(); all[pos + 1].focus(); }
        if (ev.key === "ArrowUp" && all[pos - 1]) { ev.preventDefault(); all[pos - 1].focus(); }
      };
    });
  }

  // counts and buttons
  const n = S.sel.size;
  $("#selCount").textContent = n ? `${n} selected` : "None selected";
  $("#goBtn").disabled = n === 0 || S.busy;
  $("#goBtn").textContent = S.busy ? "Migrating…" : "Migrate";
  const shownCnt = S.group ? rows.filter(r => !S.collapsed.has(r.cwd || "-")).length : rows.length;
  $("#statTotal").innerHTML = `${pl(s.sessions.length, "session")} · showing ${shownCnt}`
    + (S.group ? ` · ${pl(new Set(rows.map(r => r.cwd)).size, "project")}` : "")
    + (S.merged
        ? ` · <a href="#" id="dedupeToggle" style="color:var(--accent);text-decoration:none">
             ${S.merged} ${S.merged === 1 ? "copy" : "copies"} merged</a>`
        : (S.dedupe ? "" : ` · <a href="#" id="dedupeToggle"
             style="color:var(--accent);text-decoration:none">copies split</a>`));
  const dt = $("#dedupeToggle");
  if (dt) dt.onclick = ev => { ev.preventDefault(); S.dedupe = !S.dedupe; LS.set("dedupe", S.dedupe); render(); };
  $("#statTarget").textContent = tgtA
    ? `Target ${multiProfile() ? S.target.profile + " / " : ""}${tgtA.short} / ${(S.target.space || "").slice(0, 8)}`
    : "";

  const all = $("#allBox"), sel2 = visible().filter(r => !inTarget(r))
    .filter(r => !(S.group && S.collapsed.has(r.cwd || "-")));
  all.checked = sel2.length > 0 && sel2.every(r => S.sel.has(skey(r)));
  all.indeterminate = !all.checked && sel2.some(r => S.sel.has(skey(r)));
  all.disabled = sel2.length === 0;
}

/* ================= preview drawer ================= */
async function openDrawer(k) {
  S.drawer = k;
  $("#drawer").classList.add("on");
  history.replaceState(null, "", "#s=" + encodeURIComponent(k));
  const s = byKey(k);
  if (!s) return;
  $("#dTitle").textContent = s.title;
  $("#dMeta").innerHTML = [
    (multiProfile() ? `Profile ${s.profile}` : null),
    `Account ${s.account.slice(0, 8)}`, `Space ${s.space.slice(0, 8)}`,
    fmtTime(s.activity), s.model || "—",
    s.turns != null ? `${s.turns} turns` : null,
    s.transcript.found ? kb(s.transcript.size) : "No transcript",
    s.archived ? "Archived" : null,
  ].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  $("#dBody").innerHTML = `<div class="skel" style="width:88%"></div><div class="skel" style="width:64%"></div>
    <div class="skel" style="width:76%"></div>`;
  $("#dHint").textContent = "";
  const isCur = inTarget(s);
  $("#dMigrate").disabled = isCur;
  $("#dMigrate").textContent = isCur ? "Already in this account" : "Migrate this session";

  try {
    const j = await (await fetch(`/api/session?id=${encodeURIComponent(s.id)}&profile=${encodeURIComponent(s.profile)}`)).json();
    if (S.drawer !== k) return;
    if (!j.ok) { $("#dBody").innerHTML = `<div class="dempty">${esc(j.error)}</div>`; return; }
    renderPreview(j.session, j.preview);
  } catch (e) {
    $("#dBody").innerHTML = `<div class="dempty">Failed to load: ${esc(e.message)}</div>`;
  }
}

function renderPreview(s, p) {
  let h = "";
  if (p.error) h += `<div class="notice"><span>⚠️</span><div>${esc(p.error)}</div></div>`;

  // skip the "initial question" block when it equals the first listed message
  const firstTxt = p.messages.length && p.messages[0].role === "user" ? p.messages[0].text : null;
  const dupFirst = firstTxt && p.firstUser &&
    (firstTxt.startsWith(p.firstUser.slice(0, 120)) || p.firstUser.startsWith(firstTxt.slice(0, 120)));
  if (p.firstUser && (p.truncated || !dupFirst))
    h += `<div class="firstq"><span class="lbl">Initial question</span>${esc(p.firstUser)}</div>`;

  if (p.counts) h += `<div style="font-size:11px;color:var(--muted);margin:10px 0 2px">
    ${p.counts.user} from you · ${p.counts.assistant} from Claude
    ${p.truncated ? `(showing last ${p.messages.length})` : ""}</div>`;

  if (!p.messages.length && !p.error) h += `<div class="dempty">No displayable messages in this transcript</div>`;
  h += p.messages.map(m => `<div class="msg ${m.role === "user" ? "me" : ""} ${m.text.length > 420 ? "more" : ""}">
      <div class="who">${m.role === "user" ? "You" : "Claude"}</div>
      <div class="txt">${esc(m.text)}</div>
    </div>`).join("");

  $("#dBody").innerHTML = h;
  $("#dBody").scrollTop = 0;
  $("#dBody").querySelectorAll(".msg.more").forEach(el => {
    el.onclick = () => el.classList.toggle("open");
  });
}

function refreshDrawer() {
  if (!S.drawer) return;
  const s = byKey(S.drawer);
  if (!s) { closeDrawer(); return; }
  $("#dTitle").textContent = s.title;
  $("#dMigrate").disabled = inTarget(s);
  $("#dMigrate").textContent = inTarget(s) ? "Already in this account" : "Migrate this session";
}

function closeDrawer() {
  S.drawer = null;
  $("#drawer").classList.remove("on");
  if (location.hash.startsWith("#s=")) history.replaceState(null, "", location.pathname);
}

/* ================= interactions ================= */
$("#q").oninput = e => { S.q = e.target.value; render(); };
$("#hideCur").checked = S.hideCur;
$("#hideCur").onchange = e => { S.hideCur = e.target.checked; LS.set("hideCur", true); render(); };
$("#groupBox").onchange = e => { S.group = e.target.checked; LS.set("group", S.group); render(); };
$("#sortSel").onchange = e => { S.sort = e.target.value; LS.set("sort", S.sort); render(); };
$("#toProfile").onchange = e => {
  S.target.profile = e.target.value; S.target.account = null; S.target.space = null;
  LS.set("toProfile", S.target.profile); render();
};
$("#toAccount").onchange = e => {
  S.target.account = e.target.value; S.target.space = null; render();
};
$("#toSpace").onchange = e => { S.target.space = e.target.value; render(); };
$("#allBox").onchange = e => {
  const rows = visible().filter(r => !inTarget(r) && !(S.group && S.collapsed.has(r.cwd || "-")));
  e.target.checked ? rows.forEach(r => S.sel.add(skey(r))) : rows.forEach(r => S.sel.delete(skey(r)));
  render();
};
$("#profilesBtn").onclick = () => openProfiles();
$("#reloadBtn").onclick = () => load();
$("#goBtn").onclick = () => openConfirm([...S.sel]);
$("#syncBtn").onclick = () => openSync();
$("#dClose").onclick = closeDrawer;
$("#dMigrate").onclick = () => { if (S.drawer) singleMigrate(S.drawer); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#overlay").classList.contains("on")) closeModal(); else closeDrawer(); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    visible().filter(r => !inTarget(r)).forEach(r => S.sel.add(skey(r)));
    render();
  }
});

/* ================= modals ================= */
function modal(html, cls) {
  $("#modal").className = "modal" + (cls ? " " + cls : "");
  $("#modal").innerHTML = html;
  $("#overlay").classList.add("on");
}
function closeModal() { $("#overlay").classList.remove("on"); }
$("#overlay").onclick = e => { if (e.target.id === "overlay") closeModal(); };

function projectTree(items) {
  const g = new Map();
  for (const s of items) g.set(s.cwd, (g.get(s.cwd) || 0) + 1);
  const list = [...g.entries()].sort((a, b) => b[1] - a[1]);
  return `<div class="plist">` + list.map(([c, n]) => `<div style="display:flex;gap:10px;align-items:center">
      <span style="flex:0 0 auto">${esc(folderName(c))}</span>
      <span style="flex:1;min-width:0;font-family:var(--mono);font-size:10px;color:var(--muted);
        overflow:hidden;text-overflow:ellipsis">${esc(c)}</span>
      <span style="flex:0 0 auto;color:var(--text-2)">${n}</span>
    </div>`).join("") + `</div>`;
}

function openConfirm(keys, opts) {
  if (!keys.length) return;
  const items = keys.map(byKey).filter(Boolean);
  const asTree = (opts && opts.tree) || items.length > 30;
  const preview = asTree ? projectTree(items)
    : items.slice(0, 12).map(s => `<div title="${esc(s.title)}">${esc(s.title)}</div>`).join("");
  const more = !asTree && items.length > 12
    ? `<div style="color:var(--muted)">… ${items.length - 12} more</div>` : "";
  const tgt = profileOf(S.target.profile);
  const a = tgt ? tgt.accounts.find(x => x.id === S.target.account) : null;
  const run = !!(profileOf(S.target.profile) || {}).running;
  const clashes = items.filter(existsInTarget);
  const missing = items.filter(s => !s.transcript.found).length;

  modal(`
    <h2>Migrate ${pl(items.length, "session")}</h2>
    <div class="mbody">
      ${run ? `<div class="notice"><span>⚠️</span><div><b>Profile "${esc(S.target.profile)}" is running</b> — it rewrites this store from memory, so the migration could be lost. Other profiles can stay open.
        <div style="margin-top:7px"><button class="btn sm" id="quitNowBtn">Quit ${esc(S.target.profile)}</button></div></div></div>` : ""}
      ${clashes.length ? `<div class="notice info"><span>ℹ️</span><div><b>${clashes.length}</b> already exist in the target account.
        Left alone they are skipped; tick the option below to overwrite their metadata — that is how you push
        later turns back to the other account.</div></div>` : ""}
      ${missing ? `<div class="notice"><span>⚠️</span><div><b>${missing}</b> have no transcript jsonl; they may open empty.</div></div>` : ""}
      <div class="kv"><div class="k">Target</div><div class="v">
        ${multiProfile() ? `Profile <code>${esc(S.target.profile)}</code> / ` : ""}Account <code>${esc((S.target.account || "").slice(0, 8))}</code> / Space <code>${esc((S.target.space || "").slice(0, 8))}</code>
        ${a && a.isCurrent ? '<span class="pill cur" style="margin-left:6px">Current account</span>' : ""}
      </div></div>
      ${opts && opts.scope ? `<div class="kv"><div class="k">Scope</div><div class="v" style="font-size:12px">
        ${esc(opts.scope)}</div></div>` : ""}
      <div class="kv"><div class="k">${asTree ? "Projects" : "Sessions"}</div><div class="v" style="margin-top:2px">
        ${asTree ? preview : `<div class="plist">${preview}${more}</div>`}</div></div>
      <div class="kv"><div class="k">Note</div><div class="v" style="color:var(--text-2);font-size:12px">
        Only the metadata blob (~40 KB) is copied. The transcript jsonl stays where it is and the source account keeps its copy. You can undo afterwards.
      </div></div>
      ${clashes.length ? `<label class="chk" style="margin-top:12px"><input type="checkbox" id="overwriteBox">
        Overwrite the ${clashes.length} existing cop${clashes.length === 1 ? "y" : "ies"} in the target account</label>` : ""}
      ${run ? `<label class="chk" style="margin-top:12px"><input type="checkbox" id="forceBox">
        I understand the risk, write anyway</label>` : ""}
    </div>
    <div class="mfoot">
      <span class="left">Restart Claude to see the change</span>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="confirmBtn" ${run ? "disabled" : ""}>Start migration</button>
    </div>`);

  $("#cancelBtn").onclick = closeModal;
  const qb = $("#quitNowBtn");
  if (qb) qb.onclick = async () => {
    qb.disabled = true; qb.textContent = "Quitting…";
    const prof = S.target.profile;
    const r = await quitClaude(prof, null);
    if (r && r.ok) openConfirm(keys);
    else { qb.disabled = false; qb.textContent = "Quit " + prof; }
  };
  const fb = $("#forceBox");
  const ob = $("#overwriteBox");
  if (fb) fb.onchange = () => { $("#confirmBtn").disabled = !fb.checked; };
  $("#confirmBtn").onclick = () => doMigrate(keys, !!((fb && fb.checked) || (ob && ob.checked)));
}

// what Sync copies = what the table is showing right now, minus what is already at the target
function syncScope() {
  const bits = [];
  if (S.filter) bits.push(`account ${S.filter.account.slice(0, 8)}`);
  if (S.project) bits.push(`project ${folderName(S.project)}`);
  if (S.q.trim()) bits.push(`search "${S.q.trim()}"`);
  return bits.join(" · ");
}

function openSync() {
  // hide-current is a browsing convenience, not a scope limit — Sync ignores it
  const items = visible({ ignoreHideCur: true }).filter(s => !inTarget(s));
  if (!items.length) {
    toast(S.snap.sessions.some(s => !inTarget(s))
      ? "Nothing to sync in the current view — clear the filters to include everything"
      : "Everything is already in the target location");
    return;
  }
  openConfirm(items.map(skey), { tree: true, scope: syncScope() });
}

function singleMigrate(k) {
  const s = byKey(k);
  if (!s) return;
  if (s.current) { toast("This session is already in the current account"); return; }
  if (s.profile === S.target.profile && s.account === S.target.account && s.space === S.target.space) {
    toast("Already in the target location"); return;
  }
  if (S.snap.claudeRunning) { openConfirm([k]); return; }
  const exists = existsInTarget(s);
  modal(`
    <h2>Migrate “${esc(s.title)}”</h2>
    <div class="mbody">
      ${exists ? `<div class="notice"><span>⚠️</span><div>The target account already has this session.
        Continuing will <b>overwrite its metadata</b> with this account's newer state.</div></div>` : ""}
      <div class="kv"><div class="k">From</div><div class="v"><code>${esc(s.account.slice(0, 8))} / ${esc(s.space.slice(0, 8))}</code></div></div>
      <div class="kv"><div class="k">Target</div><div class="v"><code>${esc(S.target.account.slice(0, 8))} / ${esc((S.target.space || "").slice(0, 8))}</code></div></div>
      <div class="kv"><div class="k">Transcript</div><div class="v">${s.transcript.found
        ? esc(kb(s.transcript.size)) : '<span style="color:var(--warn)">Missing</span>'}</div></div>
    </div>
    <div class="mfoot">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="confirmBtn">Migrate</button>
    </div>`);
  $("#cancelBtn").onclick = closeModal;
  $("#confirmBtn").onclick = () => doMigrate([k], exists);
}

async function doMigrate(keys, force) {
  S.busy = true;
  const b = $("#confirmBtn");
  if (b) { b.disabled = true; b.textContent = "Migrating…"; }
  render();
  try {
    const j = await (await fetch("/api/migrate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: keys.map(k => { const x = byKey(k); return { profile: x.profile, id: x.id }; }),
        force,
        toProfile: S.target.profile,
        toAccount: S.target.account,
        toSpace: S.target.space,
      }),
    })).json();
    if (!j.ok) throw new Error(j.error || "Migration failed");
    closeModal();
    const { ok, failed } = j.summary;
    S.sel.clear();
    toast(failed ? `Done: ${ok} migrated, ${failed} failed` : `Migrated ${pl(ok, "session")}`,
          failed ? "err" : "ok",
          j.batchId && !failed ? { label: "Undo", fn: () => undo(j.batchId) } : null);
    if (failed) showFailures(j.results.filter(x => !x.ok));
    await load();
  } catch (e) {
    toast(e.message, "err");
    const c = $("#confirmBtn");
    if (c) { c.disabled = false; c.textContent = "Start migration"; }
  } finally {
    S.busy = false;
    render();
  }
}

async function undo(batchId) {
  try {
    const j = await (await fetch("/api/undo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ batchId }),
    })).json();
    if (!j.ok) throw new Error(j.error);
    toast("Migration undone", "ok");
    await load();
  } catch (e) {
    toast("Undo failed: " + e.message, "err");
  }
}

function showFailures(fails) {
  modal(`
    <h2>${pl(fails.length, "session")} not migrated</h2>
    <div class="mbody">
      <div class="notice"><span>⚠️</span><div>Usually a file with the same name already exists in the target, or the source file was moved.</div></div>
      ${fails.map(f => `<div class="kv"><div class="k" style="width:auto;flex:1;color:var(--text)">
        ${esc(f.title || f.id)}</div><div class="v" style="flex:2;color:var(--danger);font-size:12px">
        ${esc(f.error || "Unknown error")}</div></div>`).join("")}
    </div>
    <div class="mfoot"><button class="btn" id="okBtn">Close</button></div>`);
  $("#okBtn").onclick = closeModal;
}

/* ================= profiles ================= */
async function openProfiles() {
  modal(`<h2>Profiles</h2>
    <div class="mbody" id="profBody">
      <div class="skel" style="width:70%"></div><div class="skel" style="width:48%"></div>
      <div class="skel" style="width:62%"></div>
    </div>
    <div class="mfoot" style="justify-content:space-between">
      <div class="newprof">
        <input id="newProfName" placeholder="new profile name" maxlength="40" autocomplete="off">
        <button class="btn sm" id="createProfBtn">Create</button>
      </div>
      <button class="btn" id="quitAllBtn">Quit all</button>
    </div>`, "wide");
  $("#createProfBtn").onclick = createProfile;
  $("#newProfName").onkeydown = e => { if (e.key === "Enter") createProfile(); };
  $("#quitAllBtn").onclick = () => quitClaude(null, $("#quitAllBtn"));
  await refreshProfiles();
}

async function refreshProfiles() {
  const body = $("#profBody");
  if (!body) return;
  try {
    const j = await (await fetch("/api/profiles")).json();
    if (!j.ok) throw new Error(j.error);
    body.innerHTML = j.profiles.map(p => {
      const run = p.running
        ? `<span class="dot"></span> Running${p.instances.length ? ` · pid ${p.instances.join(", ")}` : ""}`
        : `<span class="dot" style="background:#c9c2ba;box-shadow:none"></span> Not running`;
      const login = p.loggedIn
        ? `signed in until ${new Date(p.expiresAt).toLocaleDateString("en-US", { month: "short", day: "numeric" })}`
        : `<span style="color:var(--warn)">not signed in</span>`;
      const acct = p.current && p.current.account
        ? `account ${esc(p.current.account.slice(0, 8))}` : "no account yet";
      return `<div class="pcard">
        <div class="pmain">
          <div class="pname">${esc(p.name)}${p.isDefault ? '<span class="pill arch">app folder</span>' : ""}</div>
          <div class="ppath" title="${esc(p.path)}">${esc(p.path.replace(/^\/Users\/[^/]+/, "~"))}</div>
          <div class="pstat">${run}<span class="sep">|</span>${login}<span class="sep">|</span>
            ${acct}<span class="sep">|</span>${pl(p.accounts, "account")}</div>
          ${usageLine(p.usage)}
        </div>
        <div class="pact">
          <button class="btn sm" data-popen="${esc(p.name)}" ${p.running ? "disabled" : ""}>Open</button>
          <button class="btn sm" data-pquit="${esc(p.name)}" ${p.running ? "" : "disabled"}>Quit</button>
        </div>
      </div>`;
    }).join("") + `<div style="font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6">
      One profile = one saved login; each launches its own Claude instance, so two accounts can run
      side by side. A new profile re-downloads what it needs — the Cowork VM image alone is ~11 GB.</div>`;
    body.querySelectorAll("[data-popen]").forEach(b => b.onclick = () => openProfile(b.dataset.popen, b));
    body.querySelectorAll("[data-pquit]").forEach(b => b.onclick = () => quitClaude(b.dataset.pquit, b));
  } catch (e) {
    body.innerHTML = `<div class="notice"><span>⚠️</span><div>${esc(e.message)}</div></div>`;
  }
}

function usageLine(u) {
  if (!u || !u.available) {
    return `<div class="usage"><span style="color:var(--muted)">no usage recorded yet —
      open this profile and use it once</span></div>`;
  }
  const L = u.latest || {};
  const col = v => v >= 90 ? "var(--danger)" : v >= 70 ? "var(--warn)" : "var(--accent)";
  const bar = v => `<span class="ubar"><i style="width:${Math.max(0, Math.min(100, v || 0))}%;
    background:${col(v || 0)}"></i></span>`;
  const d = new Date(L.t || 0);
  const hhmm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const tip = `as of ${hhmm} · ${pl(u.sampleCount, "sample")} across ${pl(u.orgCount, "org")}`
    + `, since ${new Date(u.since || 0).toLocaleString("en-US")}`;
  return `<div class="usage" title="${tip}">
    <span class="ulabel" title="5-hour window">5h ${bar(L.fh)} ${L.fh ?? 0}%</span>
    ${L.sd == null ? "" : `<span class="ulabel" title="7-day window">7d ${bar(L.sd)} ${L.sd}%</span>`}
    <span title="space ${esc(L.org || "")}">org ${esc((L.org || "").slice(0, 8))}</span>
    ${spark(u.series)}
  </div>`;
}

function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const w = 72, h = 16, pad = 1.5, max = Math.max(100, ...vals);
  const x = i => (i / (vals.length - 1)) * w;
  const y = v => (h - pad) - (v / max) * (h - pad * 2);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const base = y(0).toFixed(1);
  return `<svg class="uspark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
      preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#e8e5e1" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

async function openProfile(name, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Opening…"; }
  try {
    const j = await (await fetch("/api/profiles/open", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: name }),
    })).json();
    if (!j.ok) throw new Error(j.error);
    toast(`Launching ${name}…`, "ok");
    setTimeout(() => { refreshProfiles(); load(true); }, 1500);
  } catch (e) {
    toast(e.message, "err");
    if (btn) { btn.disabled = false; btn.textContent = "Open"; }
  }
}

async function quitClaude(name, btn) {
  const restore = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "Quitting…"; }
  try {
    const j = await (await fetch("/api/quit", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(name ? { profile: name } : { all: true }),
    })).json();
    if (!j.ok) throw new Error(j.error);
    toast(name ? `Quit ${name}` : "All Claude instances quit", "ok");
    await new Promise(r => setTimeout(r, 500));
    await load(true);
    if ($("#profBody")) await refreshProfiles();
    return j;
  } catch (e) {
    toast(e.message, "err");
    return null;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = restore || "Quit"; }
  }
}

async function createProfile() {
  const input = $("#newProfName");
  if (!input) return;
  const name = (input.value || "").trim();
  if (!name) { input.focus(); return; }
  const btn = $("#createProfBtn");
  btn.disabled = true; btn.textContent = "Creating…";
  try {
    const j = await (await fetch("/api/profiles/create", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    })).json();
    if (!j.ok) throw new Error(j.error);
    input.value = "";
    toast(`Created ${name} — launching it, sign in there`, "ok");
    await refreshProfiles();
    await openProfile(name, null);
  } catch (e) {
    toast(e.message, "err");
  } finally {
    btn.disabled = false; btn.textContent = "Create";
  }
}

function toast(msg, kind, action) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) {
    const btn = document.createElement("button");
    btn.className = "undo";
    btn.textContent = action.label;
    btn.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(btn);
  }
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .25s"; }, 6000);
  setTimeout(() => el.remove(), 6400);
}

load();
setInterval(() => { if (!S.busy && !document.hidden) load(true); }, 15000);

// deep link: #s=<sessionId> opens that preview
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#s=(.+)$/);
  if (m && S.snap) { const k = decodeURIComponent(m[1]); if (byKey(k)) openDrawer(k); }
});
(async () => {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return;
  for (let i = 0; i < 20 && !S.snap; i++) await new Promise(r => setTimeout(r, 100));
  if (S.snap) { const k = decodeURIComponent(m[1]); if (byKey(k)) openDrawer(k); }
})();
</script>
